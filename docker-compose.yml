version: '3.8'
services:
  postgres:
    container_name: tonight-db
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_DB=tonight-db
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=REDACTED
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    container_name: redis
    image: "redis:alpine"
    ports:
      - "6379:6379"

volumes:
  postgres:
